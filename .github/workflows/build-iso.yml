name: Build Macaque Classic installer ISO
# Preflight UUID-root boot and real updater with working fixture DNS before rebuilding.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-iso.yml'
permissions:
  contents: write
concurrency:
  group: installer-iso
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Check installer and dialog regressions
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
          python3 -m py_compile iso/test-installed-boot.py iso/grub-install-checked.py iso/configure-installer.py iso/boot-check.py
          python3 iso/test_bootloader_checked.py
          python3 iso/test_offline_installer.py
          python3 iso/test_dialog_rules.py
          python3 iso/test_installer_monitor.py
      - name: Preflight installed boot and updater on the previous Debian base
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/macaque-boot-preflight"
          mkdir -p "$fixture"
          trap 'sudo rm -rf -- "$fixture"' EXIT
          curl -fL --retry 3 -o "$fixture/base.iso" https://github.com/Zerocool66612/Classic-Macaque-Os/releases/download/v0.41-preview-build-6/macaque-classic-0.41-installer-20261116-211627.iso
          printf 'b1573e6df1bcfb57081bc213fe676ae5cedb553b367c30fc5bbf83b2d1117345  %s/base.iso\n' "$fixture" | sha256sum --check
          docker build -t macaque-classic-iso-builder:trixie iso
          docker run --rm --privileged --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/kit,readonly" --mount "type=bind,src=$fixture,dst=/preflight" macaque-classic-iso-builder:trixie bash -euc '
            xorriso -osirrox on -indev /preflight/base.iso -extract /live/filesystem.squashfs /preflight/root.squashfs
            unsquashfs -processors 2 -no-progress -d /preflight/root /preflight/root.squashfs >/preflight/extract.log 2>&1
            cp /kit/iso/grub-install-checked.py /preflight/root/usr/local/libexec/macaque-grub-install
            python3 /kit/build-desktop-deb.py --output /preflight/packages
            python3 /kit/iso/test-installed-boot.py /preflight/root /preflight/results /preflight/packages/macaque-classic_0.41.2_amd64.deb >/preflight/test.log 2>&1 || { tail -100 /preflight/test.log; tail -100 /preflight/results/installed-fresh.log 2>/dev/null || true; tail -100 /preflight/results/installed-updated.log 2>/dev/null || true; exit 1; }
            cat /preflight/results/installed-boot-check.json
          '
      - name: Build Debian live ISO
        run: bash build-iso.sh
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-build-diagnostics
          path: |
            output/*.log
            output/*.json
            output/*.txt
          if-no-files-found: ignore
      - name: Publish preview ISO
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(output/macaque-classic-*.iso)
          [[ ${#images[@]} -eq 1 ]] || { echo "Expected exactly one final ISO"; exit 1; }
          image="${images[0]}"
          version=$(dpkg-deb -f output/macaque-classic_*.deb Version)
          tag="v${version}-preview-build-${GITHUB_RUN_NUMBER}"
          boot_status=$(python3 -c 'import json,sys; print("passed" if json.load(open(sys.argv[1])).get("bios_live_userspace_reached") else "did not confirm startup; manual VM validation required")' "$image.boot-check.json")
          cat > release-notes.md <<'NOTES'
          Experimental Macaque Classic installer preview.

          0.41.2 forces native Wayland installer launch, uses software rendering for the
          installer slideshow, preserves verbose diagnostics, and adds light blue selections.
          Publication also requires graphical installer startup and slideshow rendering.

          Includes 0.41.1 fixes: refreshes the selected bootloader after all installer package changes,
          checks the BIOS boot disk against the installed boot filesystem, remembers it
          for subsequent Debian GRUB updates, and fixes oversized confirmation dialogs.
          Includes the 0.41 Update Center, saved-package rollback, one-login recovery,
          Macaque Web download improvements, and expanded local diagnostics.
          Adds optional-app timer/import improvements and the MIT-licensed Chicago Kare font.
          Also includes spatial folder windows, aliases, labels, stationery, expanded Get Info,
          classic application hiding and improved removable-drive desktop controls.
          Also includes window shading, spring-loaded folders and the custom boot theme.
          Download the ISO and its SHA256 checksum from Assets.
          Build diagnostics and the automated boot-check result are included.

          Publication requires fresh installed-disk BIOS boot and a real 0.41 to 0.41.2
          desktop-package update followed by a two-drive BIOS boot in disposable VMs.
          These backend tests do not automate the full Calamares GUI.
          Start in a virtual machine. Physical USB boot, UEFI execution, graphics,
          laptop controls, and installation are not certified by this automated build.
          Read the attached boot-check result before testing.
          NOTES
          printf '\nAutomated BIOS boot check: %s.\n' "$boot_status" >> release-notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "Macaque Classic ${version} Preview (build ${GITHUB_RUN_NUMBER})" --notes-file release-notes.md "$image" "$image.sha256" "$image.boot-check.json" output/package-manifest.txt output/boot-layout.txt output/installed-boot-check.json output/installer-graphics-passed.json output/installer-graphics-slideshow.png output/macaque-classic_*.deb output/macaque-classic_*.deb.sha256
      - name: Verify published desktop-update download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import sys,json,tempfile,time,subprocess
          sys.path.insert(0,'desktop')
          from update_backend import API,read_url,releases,download
          item=None
          for attempt in range(6):
              items=releases(json.loads(subprocess.check_output(['gh','api','repos/Zerocool66612/Classic-Macaque-Os/releases'],text=True)))
              item=next((x for x in items if x['version']=='0.41.2'),None)
              if item:break
              if attempt<5:time.sleep(20)
          if item is None:raise RuntimeError('Published package has not appeared in the public release listing.')
          with tempfile.TemporaryDirectory() as folder:
              info=download(item,folder)
              assert info['version']=='0.41.2'
          print('PASS: public update feed discovered 0.41.2; downloaded package checksum and metadata verified.')
          PY
