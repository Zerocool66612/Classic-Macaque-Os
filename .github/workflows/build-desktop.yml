name: Publish Macaque desktop update
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-desktop.yml'
permissions:
  contents: write
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check GNU Chess and independent window controls
        run: |
          sudo apt-get update
          sudo apt-get install -y gnuchess python3-venv libegl1 libopengl0 libxkbcommon0 fonts-dejavu-core
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install -r desktop/requirements.txt
          QT_QPA_PLATFORM=offscreen QT_AUDIO_BACKEND=pulseaudio MACAQUE_SILENT=1 .ci-venv/bin/python desktop/test_gnu_chess.py
          QT_QPA_PLATFORM=offscreen QT_AUDIO_BACKEND=pulseaudio MACAQUE_SILENT=1 .ci-venv/bin/python desktop/test_window_controls.py
      - name: Build desktop update
        run: python3 build-desktop-deb.py --output desktop-release
      - name: Publish checksummed desktop package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(desktop-release/macaque-classic_*.deb)
          [[ ${#packages[@]} -eq 1 ]]
          package="${packages[0]}"
          version=$(dpkg-deb -f "$package" Version)
          tag="v${version}-desktop-preview"
          python3 - <<'PY'
          from pathlib import Path
          text=Path('desktop/CHANGELOG.md').read_text().split('\n## ',1)[0]
          Path('desktop-release/notes.md').write_text(text+'\n\nDesktop update for an existing installed Macaque system only. Save work before installation, then log out and back in. This is not an ISO and must not be installed on a stock host distribution.\n\nRollback restores saved desktop packages only; it does not undo Debian updates or user files. The first upgrade may have no previous package cached. Local automated checks passed before publication; physical-device installation and recovery still require testing.\n')
          PY
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "Macaque Classic ${version} Desktop Update" --notes-file desktop-release/notes.md "$package" "$package.sha256"
