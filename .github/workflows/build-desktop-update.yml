name: Build Macaque Classic 0.42.14 desktop update
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'iso/**'
      - 'build-desktop-deb.py'
      - '.github/workflows/build-desktop-update.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'iso/**'
      - 'build-desktop-deb.py'
      - '.github/workflows/build-desktop-update.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install package-building prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev python3 python3-pip libegl1 libopengl0 libxcb-cursor0
          python3 -m pip install --break-system-packages PySide6
      - name: Compile-check Python sources
        run: python3 -m compileall -q desktop iso
      - name: Run offline update and UI tests
        env:
          QT_QPA_PLATFORM: offscreen
          MACAQUE_SILENT: '1'
        run: |
          cd desktop
          python3 test_update_center.py
          python3 test_classic_utilities.py
          cd ../iso
          python3 test_macaque_login.py
      - name: Build update package and checksum
        run: python3 build-desktop-deb.py --output packages
      - name: Inspect package and checksum
        run: |
          dpkg-deb --info packages/macaque-classic_0.42.14_amd64.deb
          cd packages
          sha256sum -c macaque-classic_0.42.14_amd64.deb.sha256
      - name: Publish 0.42.14 only after explicit release approval and VM validation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=v0.42.14-desktop-preview
          notes='Desktop update from 0.42.5. Adds animated busy-only Mac OS X-inspired beachball and improved secure wake lock styling, while retaining welcome, codecs and startup chime. Restart after installing.'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              packages/macaque-classic_0.42.14_amd64.deb \
              packages/macaque-classic_0.42.14_amd64.deb.sha256 --clobber
            gh release edit "$tag" --title 'Macaque Classic 0.42.14 Desktop Update' --notes "$notes"
          else
            gh release create "$tag" \
              packages/macaque-classic_0.42.14_amd64.deb \
              packages/macaque-classic_0.42.14_amd64.deb.sha256 \
              --title 'Macaque Classic 0.42.14 Desktop Update' --notes "$notes"
          fi
      - name: Save downloadable release candidate
        uses: actions/upload-artifact@v4
        with:
          name: macaque-classic-0.42.14-release-candidate
          path: |
            packages/macaque-classic_0.42.14_amd64.deb
            packages/macaque-classic_0.42.14_amd64.deb.sha256
